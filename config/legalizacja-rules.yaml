# Wzorce nazw plików → folder "Ważne" (tylko dokumenty tożsamości i końcowe)
folder_wazne_filename_patterns:
  - paszport
  - passport
  - dyplom
  - diploma
  - decyzja
  - decision
  - "karta pobytu"
  - "residence card"
  - "zezwolenie na prace"
  - wiza
  - visa
  - rezydent
  - odwolanie
  - "WP_"
  - "KP_skan"

# Wzorce nazw plików → folder "TRC"
folder_trc_filename_patterns:
  - "wniosek.*(?:pobyt|TRC|MOS|INPOL)"
  - "załącznik nr"
  - stempel
  - upo
  - wezwanie
  - zawiadomienie
  - ponaglenie
  - przyspieszenie
  - uzupełnienie
  - "opłata.*(?:skarbowa|440|100|pobyt|kart)"
  - pełnomocnictwo
  - "PoA_"
  - "pismo przewodnie"
  - OSW-UTRZYMANIE
  - OSW-NIEKARALNOSC
  - OSW-POBYT-3-LATA
  - "oświadczenie.*(?:utrzymanie|niekaralność|pobyt.*3.*lat|liczba.*osób)"
  - "umowa najm"
  - polisa
  - ubezpieczenie
  - PIT
  - ZUS
  - rachunek
  - "umowa.*(?:dzieło|zlecenie|praca|współpraca)"
  - aneks
  - "informacja starosty"
  - tłumaczenie
  - doświadczenie
  - "potwierdzenie.*(?:wysłania|złożenia|ePUAP|poczta)"

# Wzorce nazw plików → folder "Oświadczenie"
folder_oswiadczenie_filename_patterns:
  - WNIOSEK-OSW
  - PSZ-OPPC
  - PSZ-OPWP
  - PSZ-ZOPP
  - PSZ-PPPO
  - PSZ-PZPO
  - PGP-UZC
  - "podjęcie.*pracy"
  - "niepodjęcie.*pracy"
  - "zakończenie.*pracy"
  - "zgłoszenie.*umowy"
  - "oświadczenie.*draft"

# Wzorce nazw plików → folder "Zezwolenie"
folder_zezwolenie_filename_patterns:
  - "wniosek.*zezwolenie.*prac"
  - "WRP-"
  - "opłata.*zezwolenie"

# ---------------------------------------------------------------------------
# 13. Przełączniki kategorii (do potwierdzenia z Działem Legalizacji)
# ---------------------------------------------------------------------------
folder_przelaczniki:
  # Czy dokument końcowy procedury (decyzja WP, oświadczenie wpisane, decyzja TRC)
  # ma być w "Ważne" (domyślnie) czy razem z resztą procedury w TRC/Oświadczenie/Zezwolenie?
  dokument_koncowy_w_wazne:
    default: true
    opis: "Domyślnie: tak — decyzja/oświadczenie wpisane trafia do Ważne, reszta procedury do TRC/Oświadczenie"

  # Czy potrzebne są osobne kategorie dla pobytu stałego i rezydenta UE?
  osobne_foldery_pobyt_staly_rezydent:
    default: false
    opis: "Domyślnie: nie — wspólna kategoria TRC wystarczy"
