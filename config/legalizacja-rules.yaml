      instrukcja_1_2: "Wiza nigdy nie tworzy zatrudnieniowej"

  # 10. Rejestracja UE — data ważności
  # Instrukcja 1.2: data ważności blankietu → data do
  # Reguły mapowania (domyślnie): bezterminowo
  rejestracja_ue_data:
    default: "reguly_mapowania"
    options:
      reguly_mapowania: "Bezterminowo (brak daty do)"
      instrukcja_1_2: "Data ważności blankietu → data do"

  # 11. Obywatel UK — nazwa pobytowej
  # Instrukcja 1.2: "Umowa wystąpienia (UK)"
  # Reguły mapowania (domyślnie): "Umowa wystąpienia"
  obywatel_uk_nazwa:
    default: "reguly_mapowania"
    options:
      reguly_mapowania: "Umowa wystąpienia"
      instrukcja_1_2: "Umowa wystąpienia (UK)"

  # 12. Blue Card bez warunków zatrudnienia
  # Instrukcja 1.2: otwarty dostęp (OD)
  # Reguły mapowania (domyślnie): brak takiej reguły
  blue_card_bez_warunkow:
    default: "reguly_mapowania"
    options:
      reguly_mapowania: "Brak specjalnej reguły — TRC_BLUE_CARD"
      instrukcja_1_2: "Otwarty dostęp (OD)"

  # 13. Blue Card — pracodawca
  # Instrukcja 1.2: tylko z sentencji
  # Reguły mapowania (domyślnie): z uzasadnienia, brak → flaga
  blue_card_pracodawca:
    default: "reguly_mapowania"
    options:
      reguly_mapowania: "Z uzasadnienia gdy brak w sentencji, brak → flaga 'uzupełnij pracodawcę'"
      instrukcja_1_2: "Tylko z sentencji (brak = brak)"

