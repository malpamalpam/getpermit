# ---------------------------------------------------------------------------
# 12. Kategorie załączników (6-folderowy system)
# ---------------------------------------------------------------------------
# Dział Legalizacji może zmienić nazwy i mapowanie bez zmiany kodu.
# Każda kategoria: klucz (ID w bazie), label (PL), tworz_zawsze, styl (kolor w UI).
# Kolejność = kolejność wyświetlania w profilu.

folders:
  wazne:
    label: "Ważne"
    description: "Własne dokumenty tożsamości i dokumenty końcowe cudzoziemca"
    tworz_zawsze: true
    styl: "border-emerald-200 bg-emerald-50/50"
    # Co trafia: paszport, karta pobytu, wiza, decyzje pobytowe, zezwolenie na pracę,
    # oświadczenie wpisane do ewidencji, powiadomienie, PESEL UKR, CUKR, dyplom PL
    # NIE trafia: załączniki do wniosków, opłaty, zgłoszenia, korespondencja, dokumenty innej osoby

  trc:
    label: "TRC"
    description: "Cała procedura pobytowa"
    tworz_zawsze: false
    styl: "border-indigo-200 bg-indigo-50/50"
    # Co trafia: wniosek, Załącznik nr 1 i 2, OSW-UTRZYMANIE, OSW-NIEKARALNOSC,
    # UPO/stempel, opłaty skarbowe (pobyt, karta), pełnomocnictwa, wezwania,
    # zawiadomienia, odpowiedzi, ponaglenia, umowy/rachunki/PIT/ZUS jako dowody

  oswiadczenie:
    label: "Oświadczenie"
    description: "Cała procedura oświadczenia o powierzeniu pracy"
    tworz_zawsze: false
    styl: "border-amber-200 bg-amber-50/50"
    # Co trafia: WNIOSEK-OSW, opłata za oświadczenie, zgłoszenie podjęcia/niepodjęcia pracy,
    # potwierdzenie zgłoszenia umowy, potwierdzenia doświadczenia do PUP,
    # pełnomocnictwo do PUP, korespondencja z PUP

  zezwolenie:
    label: "Zezwolenie"
    description: "Cała procedura zezwolenia na pracę"
    tworz_zawsze: false
    styl: "border-purple-200 bg-purple-50/50"
    # Co trafia: wniosek o zezwolenie, informacja starosty, opłata,
    # potwierdzenia doświadczenia, załączniki, pełnomocnictwo, korespondencja z wojewodą

  dokumenty_rodziny:
    label: "Dokumenty członków rodziny"
    description: "Dokumenty innej osoby niż cudzoziemiec (dziecko, małżonek)"
    tworz_zawsze: false
    styl: "border-blue-200 bg-blue-50/50"

  inne_dokumenty:
    label: "Inne dokumenty"
    description: "Dokumenty nie pasujące do żadnej kategorii"
    tworz_zawsze: false
    styl: ""

