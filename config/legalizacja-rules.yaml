# ---------------------------------------------------------------------------
# 2. Frazy rozpoznania decyzji — sentencja (pozytywna / negatywna)
# ---------------------------------------------------------------------------
sentencja_positive:
  - "udzielam"
  - "udziela się"
  - "zezwala się"
  - "orzekam o udzieleniu"
  - "postanawiam udzielić"
  - "nadaje się"
  - "postanawiam nadać"

sentencja_negative:
  - "odmawiam"
  - "odmawia się"
  - "umarza się"
  - "umarzam"
  - "cofa się"
  - "cofam"

sentencja_change:
  - "orzekam o zmianie zezwolenia"
  - "zmieniam decyzję"

