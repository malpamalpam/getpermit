# ---------------------------------------------------------------------------
# 9. Przełączniki (sekcja 9 — rozbieżności między dokumentami)
# Domyślnie: wg Reguł mapowania (nie Instrukcji 1.2)
# ---------------------------------------------------------------------------
przelaczniki:
  # 1. Nazwy zatrudnieniowe przy pobycie stałym / rezydencie / uchodźcy / ochronie
  # Instrukcja 1.2: "OD — pobyt stały" itd.
  # Reguły mapowania (domyślnie): Pobyt Stały / Pobyt Rezydenta UE / Status uchodźcy / Ochrona uzupełniająca
  nazwy_zatrudnieniowe_pobyt_staly:
    default: "reguly_mapowania"
    options:
      reguly_mapowania: "Pobyt Stały / Pobyt Rezydenta długoterminowego UE / Status uchodźcy / Ochrona uzupełniająca"
      instrukcja_1_2: "OD — pobyt stały / OD — rezydent UE / OD — uchodźca / OD — ochrona uzupełniająca"

  # 2. TRC – inny pracodawca — czy tworzy podstawę zatrudnieniową
  # Instrukcja 1.2: tak
  # Reguły mapowania (domyślnie): NIE — tylko pobytowa
  trc_inny_pracodawca_zatrudnieniowa:
    default: "reguly_mapowania"
    options:
      reguly_mapowania: "Tylko podstawa pobytowa (praca w FDK wymaga osobnej podstawy)"
      instrukcja_1_2: "Pobytowa + zatrudnieniowa TRC – inny pracodawca"

  # 3. art.144, 158, 159, 186 pkt 6 — nazwy zatrudnieniowe
  # Instrukcja 1.2: OD — status studenta / małżonek / OD / absolwent tylko z dyplomu
  # Reguły mapowania (domyślnie): TRC – studia / TRC - Małżonek / TRC – pobyt z cudzoziemcem / TRC – absolwent (w obu)
  nazwy_zatrudnieniowe_trc_specjalne:
    default: "reguly_mapowania"
    options:
      reguly_mapowania: "TRC – studia / TRC - Małżonek obywatela PL / TRC – pobyt z cudzoziemcem / TRC – absolwent"
      instrukcja_1_2: "OD — status studenta / OD — małżonek / OD / absolwent (tylko z dyplomu)"

  # 4. art.186 ust.1 pkt 3, 4, 8 — zatrudnieniowa
  # Instrukcja 1.2 (★ niezatwierdzone): OD
  # Reguły mapowania (domyślnie): brak zatrudnieniowej
  art_186_3_4_8_zatrudnieniowa:
    default: "reguly_mapowania"
    options:
      reguly_mapowania: "Brak podstawy zatrudnieniowej"
      instrukcja_1_2: "OD (niezatwierdzone)"

  # 5. Legitymacja studencka
  # Instrukcja 1.2: nie tworzy podstawy
  # Reguły mapowania (domyślnie): "status studenta"
  legitymacja_studencka:
    default: "reguly_mapowania"
    options:
      reguly_mapowania: "Tworzy podstawę 'status studenta'"
      instrukcja_1_2: "Nie tworzy podstawy"

  # 6. Stempel / UPO — nazwa pobytowej
